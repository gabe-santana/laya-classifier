[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "laya-classifier"
version = "0.1.0"
description = "Email security screener: Laya reads the text, deterministic checks read the headers, links and attachments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "laya[serve]>=0.3.21",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
laya-screener = "laya_screener.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
laya_screener = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
